# Production stack: PostgreSQL + API + Frontend (Traefik)
#
# VPS layout (compose lives next to .env, repo is in ./src):
#   /srv/test-archery/
#   +-- .env
#   +-- docker-compose.prod.yml   # copy of this file
#   +-- src/                      # git repo
#
# Deploy: bash /srv/test-archery/src/deploy/deploy.sh

services:
  db:
    image: postgres:18-alpine
    container_name: archery_db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - archery_pg18_data:/var/lib/postgresql
    networks:
      - archery_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: apps/api/Dockerfile
    container_name: archery_api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/uploads:/app/uploads
      - ./src/apps/api/uploads:/app/apps/api/uploads
    networks:
      - archery_network
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-public'
      - 'traefik.http.routers.archery-api.rule=Host(`api-archery.fedirko.pro`)'
      - 'traefik.http.routers.archery-api.entrypoints=websecure'
      - 'traefik.http.routers.archery-api.tls.certresolver=le'
      - 'traefik.http.services.archery-api.loadbalancer.server.port=3000'
    command: >
      sh -c "./node_modules/.bin/mikro-orm migration:up && node dist/src/main.js"

  frontend:
    build:
      context: ./src
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_AUTH_URL: ${NEXT_PUBLIC_GOOGLE_AUTH_URL}
        NEXT_PUBLIC_APP_BUILD_ID: ${APP_BUILD_ID:-local}
        NEXT_PUBLIC_SITE_MODE: ${NEXT_PUBLIC_SITE_MODE:-test}
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    container_name: archery_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - archery_network
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-public'
      - 'traefik.http.routers.archery-front.rule=Host(`archery.fedirko.pro`)'
      - 'traefik.http.routers.archery-front.entrypoints=websecure'
      - 'traefik.http.routers.archery-front.tls.certresolver=le'
      - 'traefik.http.services.archery-front.loadbalancer.server.port=3001'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  archery_network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  archery_pg18_data:
