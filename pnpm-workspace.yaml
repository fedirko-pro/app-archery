packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  '@isaacs/brace-expansion': '>=5.0.1'
  brace-expansion: '>=5.0.9'
  minimatch: '>=10.2.5'
  '@angular-devkit/core>ajv': '>=8.18.0'
  '@rushstack/node-core-library>ajv': '>=8.18.0'
  esbuild: '>=0.25.0'
  browserslist: '>=4.28.7'
  fast-uri: '>=4.1.3'
  glob: '>=10.5.0'
  '@istanbuljs/load-nyc-config>js-yaml': '3.15.1'
  'cosmiconfig>js-yaml': '>=4.3.1'
  lodash: '>=4.17.23'
  magic-string: ^0.30.10
  multer: '>=2.2.0'
  nanoid: '^3.3.17'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
  tmp: '>=0.2.4'
  vite: '>=6.4.3'
  webpack: '>=5.104.1'
