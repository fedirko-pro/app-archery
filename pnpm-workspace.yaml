packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 has no published release (3.0.4 does not exist).
# Reachable only through MikroORM's file globs, not request input.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

overrides:
  '@isaacs/brace-expansion': '>=5.0.1'
  brace-expansion: '>=5.0.11'
  minimatch: '>=10.2.5'
  '@angular-devkit/core>ajv': '>=8.18.0'
  '@rushstack/node-core-library>ajv': '>=8.18.0'
  esbuild: '>=0.25.0'
  browserslist: '>=4.28.7'
  fast-uri: '>=4.1.5'
  figlet: '>=1.11.3'
  handlebars: '>=4.7.10'
  glob: '>=10.5.0'
  '@istanbuljs/load-nyc-config>js-yaml': '3.15.2'
  'cosmiconfig>js-yaml': '>=4.3.2'
  lodash: '>=4.17.23'
  magic-string: ^0.30.10
  multer: '>=2.4.0'
  nanoid: '^3.3.17'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.18'
  proxy-addr: '>=2.0.8'
  qs: '>=6.16.0'
  sharp: '>=0.35.4'
  source-map-js: '>=1.2.2'
  tmp: '>=0.2.4'
  vite: '>=6.4.3'
  webpack: '>=5.104.1'
