name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Catch high audit regressions even when no push/PR lands that week.
    - cron: '0 6 * * 1'

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v5

      # Version comes from package.json "packageManager" (pnpm@11.22.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs early on every CI trigger (dev/main push, PRs into those, weekly).
      - run: pnpm audit --audit-level=high

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
